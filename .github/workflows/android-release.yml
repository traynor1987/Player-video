name: Android release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release-signing.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.ref_type != 'tag' }}
      - name: Validate release inputs
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            expected="${GITHUB_REF_NAME#v}"
            actual="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
            test "$expected" = "$actual"
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
      - name: Test and lint
        run: gradle --no-daemon test lintRelease
      - name: Build signed APK
        run: gradle --no-daemon assembleRelease
      - name: Verify signature and package
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          badging="$($build_tools/aapt dump badging "$apk")"
          grep -F "package: name='com.traynor.player'" <<< "$badging"
          version="${GITHUB_REF_NAME#v}"
          code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          grep -F "versionCode='$code' versionName='$version'" <<< "$badging"
          cp "$apk" "Player-v${version}.apk"
          sha256sum "Player-v${version}.apk" > "Player-v${version}.apk.sha256"
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Player-${{ github.ref_name }}-signed
          path: |
            Player-v*.apk
            Player-v*.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Player-v*.apk
            Player-v*.apk.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Native Android IPTV player foundation.

            The attached SHA-256 file is used by Player before an in-app update is offered to Android's installer.

            This application contains no IPTV subscription, playlist, channel, or stream. Add only a source you are authorised to use.
      - name: Remove signing material
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
