name: Generate Android Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate permanent signing keystore
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing ANDROID_KEY_ALIAS'; exit 1; }

      - name: Generate permanent Android release keystore
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -v \
            -keystore player-release.jks \
            -storetype PKCS12 \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASSWORD" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 18250 \
            -dname "CN=Player, OU=Android, O=Player-video, L=Skelmersdale, ST=Lancashire, C=GB"

      - name: Verify generated keystore
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list -keystore player-release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo 'Signing keystore generated and verified.'

      - name: Upload private keystore backup
        uses: actions/upload-artifact@v4
        with:
          name: player-release-keystore-KEEP-SAFE
          path: player-release.jks
          retention-days: 1
          if-no-files-found: error

      - name: Create Base64 file for GitHub secret
        run: |
          set -euo pipefail
          base64 -w 0 player-release.jks > ANDROID_KEYSTORE_BASE64.txt
          echo 'Base64 secret file created. Download the private artifact, extract this value locally, then add it as ANDROID_KEYSTORE_BASE64. Do not print it in logs.'

      - name: Upload Base64 secret file
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore-base64-DELETE-AFTER-USE
          path: ANDROID_KEYSTORE_BASE64.txt
          retention-days: 1
          if-no-files-found: error
